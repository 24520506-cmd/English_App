spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/english_app}
    username: ${DATABASE_USER:english_app}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
server:
  port: ${PORT:8080}
